services:
  # Base de Datos Geoespacial y Relacional
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: krop-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  # Broker de Mensajería Interna (AMQP)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: krop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"        # Puerto AMQP
      - "${RABBITMQ_MGMT_PORT}:15672"  # Panel Web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Broker MQTT para Telemetría y Dispositivos IoT (ESP32 / Rovers)
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: krop-mqtt-broker
    ports:
      - "${MQTT_PORT}:1883"
      - "${MQTT_WS_PORT}:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Emulador de AWS S3 Gratuito (Community)
  localstack:
    image: localstack/localstack:3.0.0
    container_name: krop-localstack
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - DISABLE_EVENTS=1

  # Backend Principal (Java Spring Boot WebFlux)
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: krop-core-service
    ports:
      - "${CORE_SERVICE_PORT}:8080"
    environment:
      - R2DBC_URL=r2dbc:postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-postgis:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      - postgres-postgis
      - rabbitmq
      - localstack

  # API para Rovers y Sensores IoT (FastAPI + Bridge MQTT/AMQP)
  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    container_name: krop-iot-service
    ports:
      - "${IOT_SERVICE_PORT}:8000"
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
    depends_on:
      - rabbitmq
      - mqtt-broker
      - localstack

  # Scheduler en Bucle Local
  scheduler-service:
    build:
      context: ./services/scheduler-service
      dockerfile: Dockerfile
    container_name: krop-scheduler-service
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_HOST=postgres-postgis
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - rabbitmq
      - postgres-postgis

  # Worker: Procesamiento de Imágenes Ópticas Satelitales
  optical-worker:
    build:
      context: ./services/workers/optical-worker
      dockerfile: Dockerfile
    container_name: krop-optical-worker
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_HOST=postgres-postgis
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      - rabbitmq
      - postgres-postgis

  # Worker: Procesamiento de Radar SAR (Sentinel-1)
  radar-worker:
    build:
      context: ./services/workers/radar-worker
      dockerfile: Dockerfile
    container_name: krop-radar-worker
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_HOST=postgres-postgis
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
    depends_on:
      - rabbitmq
      - postgres-postgis

  # Worker: Visión Proximal y Procesamiento OpenCV de Fotos del Rover
  proximal-vision-worker:
    build:
      context: ./services/workers/proximal-vision-worker
      dockerfile: Dockerfile
    container_name: krop-proximal-vision-worker
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_HOST=postgres-postgis
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      - rabbitmq
      - postgres-postgis

  # Worker: Series de Tiempo Climáticas y Datos Meteorológicos
  timeseries-weather-worker:
    build:
      context: ./services/workers/timeseries-weather-worker
      dockerfile: Dockerfile
    container_name: krop-timeseries-weather-worker
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_HOST=postgres-postgis
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - rabbitmq
      - postgres-postgis

volumes:
  postgis_data:
  rabbitmq_data:
  mosquitto_data:
  mosquitto_log: